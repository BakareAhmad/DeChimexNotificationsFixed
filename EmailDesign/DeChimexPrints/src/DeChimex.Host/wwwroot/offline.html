<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — DE-CHIMEX PRINTS</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f7f7f5; color: #1c1c1a; padding: 24px; text-align: center;
        }
        .card { max-width: 420px; background: #fff; border: 1px solid #e6e4de; border-radius: 14px;
                padding: 36px 28px; box-shadow: 0 8px 24px rgba(0,0,0,.05); }
        .mark { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 12px;
                background: #111; color: #fff; display: grid; place-items: center;
                font-weight: 800; font-size: 20px; letter-spacing: .5px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { font-size: 14px; line-height: 1.55; color: #57554e; margin: 0 0 20px; }
        button {
            appearance: none; border: 0; background: #111; color: #fff; font-weight: 600;
            padding: 10px 22px; border-radius: 8px; font-size: 14px; cursor: pointer;
        }
        button:hover { background: #333; }
        .hint { margin-top: 14px; font-size: 12px; color: #8a887f; }
    </style>
</head>
<body>
    <!-- AUD-029: served by the service worker when a navigation fails offline. -->
    <main class="card">
        <div class="mark" aria-hidden="true">DC</div>
        <h1>You're offline</h1>
        <p>This page needs a connection. Anything you already opened may still be readable from
           history &mdash; your cart and order progress are safe on the server and will sync when
           you're back online.</p>
        <button onclick="location.reload()">Try again</button>
        <p class="hint">Check your mobile data or Wi&mdash;Fi, then retry.</p>
    </main>
</body>
</html>
